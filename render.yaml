services:
  - type: web
    name: which-state-am-i-2050
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python generate_poster.py
    startCommand: gunicorn web.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
    autoDeploy: true